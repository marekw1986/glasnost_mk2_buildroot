image boot.vfat {
	vfat {
		files = {
			"zImage",
			"glasnost_mk2.dtb",
			"extlinux"
		}
	}
	size = 64M
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xE
		bootable = "true"
        offset = 0x200000
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
